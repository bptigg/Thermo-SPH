name: Mirror to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror branch to GitLab
        uses: codyde/branch-mirroring-action@v10
        with:
          target_repo_url: "git@gitlab.com:juft2450/Thermo-SPH.git"
          ssh_private_key: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
          source_branch_id: "main"
